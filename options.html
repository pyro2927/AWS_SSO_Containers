<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      form div {
        display:grid;
        grid-template-columns: max-content max-content;
        grid-gap:5px;
      }
      form div label {
        text-align:right;
      }
    </style>
  </head>

  <body>
    <form>
      <div>
        <label for="template">Container name template:</label>
        <input type="text" id="template" name="template" size="40" />

        <label for="preview">Preview:</label>
        <input type="text" id="preview" readonly />

        <label for="length">Maximum container name length:</label>
        <input type="number" id="length" name="length" />

        <label for="slug">Common name prefix to remove:</label>
        <input type="text" id="slug" name="slug" />
      </div>
      <p>Available variables:</p>
      <ul>
        <li>name</li>
        <li>email</li>
        <li>number</li>
        <li>role</li>
        <li>subdomain</li>
      </ul>
      <button type="submit">Save</button>

      <hr />
      <h3>Container cleanup</h3>
      <div>
        <label for="cleanupOnClose">Delete container when its last tab closes:</label>
        <input type="checkbox" id="cleanupOnClose" name="cleanupOnClose" />

        <label for="cleanupGraceSeconds">Grace period before deleting (seconds):</label>
        <input type="number" id="cleanupGraceSeconds" name="cleanupGraceSeconds" min="0" />

        <label for="cleanupScheduled">Periodically delete empty containers:</label>
        <input type="checkbox" id="cleanupScheduled" name="cleanupScheduled" />

        <label for="cleanupInterval">Cleanup interval (minutes):</label>
        <input type="number" id="cleanupInterval" name="cleanupInterval" min="1" />
      </div>
      <p>
        <button type="button" id="cleanupNow">Clean up empty containers now</button>
        <span id="cleanupStatus"></span>
      </p>
    </form>

    <script src="options.js"></script>
  </body>
</html>
